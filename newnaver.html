<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVER</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .search-container {
      width: 100%;
      max-width: 600px;
    }

    .logo {
      text-align: center;
      font-size: 60px;
      font-weight: bold;
      color: #03c75a;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      align-items: center;
      border: 3px solid #03c75a;
      border-radius: 50px;
      padding: 12px 20px;
      background: #fff;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 20px;
      padding: 10px;
    }

    .search-button {
      background-color: #03c75a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .search-button:hover {
      opacity: 0.9;
    }

    .shortcut-list {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      list-style: none;
    }

    .shortcut-item a {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      color: #222;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
    }

    .shortcut-item a:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <main class="search-container">
    <div class="logo">NAVER</div>
    <div class="search-box">
      <input type="text" class="search-input" placeholder="검색어를 입력하세요" />
      <button class="search-button">검색</button>
    </div>
    <ul class="shortcut-list">
      <li class="shortcut-item"><a href="https://mail.naver.com" target="_blank">메일</a></li>
      <li class="shortcut-item"><a href="https://cafe.naver.com" target="_blank">카페</a></li>
      <li class="shortcut-item"><a href="https://blog.naver.com" target="_blank">블로그</a></li>
      <li class="shortcut-item"><a href="https://shopping.naver.com/ns/home" target="_blank">쇼핑</a></li>
      <li class="shortcut-item"><a href="https://news.naver.com" target="_blank">뉴스</a></li>
      <li class="shortcut-item"><a href="https://finance.naver.com" target="_blank">증권</a></li>
      <li class="shortcut-item"><a href="https://map.naver.com" target="_blank">지도</a></li>
      <li class="shortcut-item"><a href="https://comic.naver.com" target="_blank">웹툰</a></li>
    </ul>
  </main>

  <script>
    const searchInput = document.querySelector('.search-input');
    const searchButton = document.querySelector('.search-button');

    function searchNaver() {
      const query = searchInput.value.trim();
      if (query !== '') {
        const url = `https://search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
        window.location.href = url;
      }
    }

    searchButton.addEventListener('click', searchNaver);
    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        searchNaver();
      }
    });
  </script>
</body>
</html>
